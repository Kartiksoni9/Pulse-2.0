<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06060f">
<title>Pulse Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#5c4ef0;--accent2:#8b6ff7;--accent3:#b48eff;
  --teal:#00d4aa;--pink:#fd79a8;
  --text:rgba(255,255,255,0.90);--text2:rgba(255,255,255,0.50);
  --muted:rgba(255,255,255,0.25);--danger:#e17055;--success:#00b894;
  --surface:rgba(8,8,18,0.85);--surface2:rgba(12,12,22,0.95);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.05);
  --input-bg:rgba(255,255,255,0.05);
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-xl:24px;
}
html{height:100%;height:-webkit-fill-available}
body{
  height:100%;height:100dvh;
  font-family:'Inter',sans-serif;
  background:#06060f;
  color:var(--text);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* ── CANVAS ── */
#bgCanvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  z-index:0;display:block;
  pointer-events:none;
}

/* ── KEYFRAMES ── */
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes memberIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,184,148,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(0,184,148,0)}}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
@keyframes pickerIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ══ JOIN SCREEN ══ */
#joinScreen{
  position:relative;z-index:10;
  width:min(420px,calc(100vw - 24px));
  max-height:calc(100dvh - 24px);
  overflow-y:auto;
  background:rgba(6,6,15,0.70);
  border:0.5px solid rgba(255,255,255,0.12);
  border-radius:var(--r-xl);
  padding:36px 28px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 0.5px rgba(255,255,255,.06) inset;
  animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;
}
#joinScreen::-webkit-scrollbar{display:none}

.join-logo{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.logo-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 8px 24px rgba(92,78,240,.5);
}
.join-logo h1{font-family:'Outfit',sans-serif;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
.join-label{font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.join-input{
  width:100%;padding:12px 16px;
  background:var(--input-bg);border:0.5px solid var(--border);
  border-radius:var(--r-md);outline:none;
  color:var(--text);font-family:'Inter',sans-serif;font-size:15px;
  transition:border-color .2s,box-shadow .2s;
  margin-bottom:16px;-webkit-appearance:none;
}
.join-input:focus{border-color:rgba(92,78,240,.55);box-shadow:0 0 0 3px rgba(92,78,240,.13)}
.join-input::placeholder{color:var(--muted)}
.room-code-input{letter-spacing:5px;text-transform:uppercase;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px}
.join-input.error{border-color:var(--danger);animation:shake .35s ease}
.btn-primary{
  width:100%;padding:13px;
  background:var(--accent);border:none;border-radius:var(--r-md);
  cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;
  color:#fff;letter-spacing:.2px;
  transition:background .2s,transform .15s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(92,78,240,.38);
  -webkit-tap-highlight-color:transparent;
}
.btn-primary:active{transform:scale(.98)}
.btn-outline{
  width:100%;padding:12px;
  background:transparent;border:0.5px solid var(--border);
  border-radius:var(--r-md);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:400;
  color:var(--text2);transition:border-color .2s,color .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn-outline:active{background:rgba(92,78,240,.07)}
.mb-16{margin-bottom:16px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:16px 0 20px}
.divider::before,.divider::after{content:'';flex:1;height:.5px;background:var(--border)}
.code-box{
  background:rgba(92,78,240,.07);border:0.5px solid rgba(92,78,240,.28);
  border-radius:var(--r-md);padding:16px;text-align:center;
  margin:4px 0 16px;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.code-box:active{background:rgba(92,78,240,.14)}
.code-value{font-family:'Outfit',sans-serif;font-size:30px;font-weight:800;letter-spacing:7px;color:var(--accent3)}
.code-hint{font-size:11px;color:var(--muted);margin-top:5px}

/* ══ CHAT SCREEN ══ */
#chatScreen{
  position:fixed;inset:0;width:100%;height:100dvh;
  z-index:10;display:none;flex-direction:column;
  background:rgba(6,6,15,.88);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;
  overflow:hidden;
}
.chat-header{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;padding-top:max(13px,env(safe-area-inset-top));
  border-bottom:0.5px solid var(--border2);
  background:var(--surface2);flex-shrink:0;
}
.header-info{flex:1;min-width:0}
.header-title{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:#fff;line-height:1.1}
.header-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online-dot{width:5px;height:5px;border-radius:50%;background:var(--success);flex-shrink:0;animation:pulseDot 2.5s infinite}
.room-pill{
  background:rgba(92,78,240,.12);border:0.5px solid rgba(92,78,240,.3);
  border-radius:20px;padding:4px 11px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;
  color:var(--accent3);letter-spacing:2px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.room-pill:active{background:rgba(92,78,240,.22)}
.members-toggle{
  width:34px;height:34px;border-radius:9px;
  border:0.5px solid var(--border);background:transparent;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.members-badge{
  position:absolute;top:-4px;right:-4px;
  width:16px;height:16px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:9px;font-weight:700;font-family:'Outfit',sans-serif;
  display:flex;align-items:center;justify-content:center;
}
.btn-leave{
  padding:6px 12px;background:rgba(225,112,85,.08);
  border:0.5px solid rgba(225,112,85,.22);border-radius:var(--r-sm);
  cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;
  color:var(--danger);white-space:nowrap;flex-shrink:0;
  transition:background .2s;-webkit-tap-highlight-color:transparent;
}
.btn-leave:active{background:rgba(225,112,85,.16)}

/* drawer */
#membersDrawer{
  position:absolute;top:0;right:0;bottom:0;
  width:min(240px,78vw);
  background:rgba(8,8,18,.98);border-left:0.5px solid var(--border);
  z-index:20;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
  padding-top:max(0px,env(safe-area-inset-top));
  backdrop-filter:blur(24px);
}
#membersDrawer.open{transform:translateX(0)}
.drawer-header{padding:16px 14px;border-bottom:0.5px solid var(--border2);display:flex;align-items:center;justify-content:space-between}
.drawer-brand{display:flex;align-items:center;gap:8px}
.drawer-icon{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.drawer-brand-name{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:#fff}
.drawer-close{width:28px;height:28px;border-radius:7px;border:0.5px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.room-chip-wrap{padding:12px 14px 8px}
.room-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(92,78,240,.10);border:0.5px solid rgba(92,78,240,.25);border-radius:var(--r-sm);padding:5px 10px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rc-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);flex-shrink:0}
.members-section-label{padding:4px 14px 8px;font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.member-count-badge{background:rgba(92,78,240,.18);color:var(--accent3);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
#membersList{flex:1;overflow-y:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:1px}
#membersList::-webkit-scrollbar{width:2px}
#membersList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}
.member-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;animation:memberIn .3s cubic-bezier(.16,1,.3,1) both;transition:background .15s}
.member-item:hover{background:rgba(255,255,255,.03)}
.member-avatar-sm{width:28px;height:28px;border-radius:50%;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.member-name{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-name.is-you{color:var(--accent3)}
.member-online{width:5px;height:5px;border-radius:50%;background:var(--success);flex-shrink:0;margin-left:auto;animation:pulseDot 2.5s infinite}
#drawerBackdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none;backdrop-filter:blur(2px)}
#drawerBackdrop.show{display:block}

/* main chat */
.chat-main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
#chat{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
#chat::-webkit-scrollbar{width:2px}
#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:80%;margin-bottom:5px;animation:msgIn .22s cubic-bezier(.16,1,.3,1) both}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.msg-avatar{width:26px;height:26px;border-radius:50%;color:#fff;font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-content{display:flex;flex-direction:column;gap:2px}
.msg-row.self .msg-content{align-items:flex-end}
.msg-name{font-size:10px;font-weight:500;color:var(--muted);padding:0 4px}
.msg-bubble{padding:9px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;word-break:break-word}
.msg-row.self .msg-bubble{background:var(--accent);border-bottom-right-radius:3px;color:#fff;box-shadow:0 4px 16px rgba(92,78,240,.3)}
.msg-row.other .msg-bubble{background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.08);border-bottom-left-radius:3px;color:var(--text)}
.msg-time{font-size:10px;color:var(--muted);padding:0 4px}
.system-msg{align-self:center;font-size:11px;color:var(--muted);background:rgba(255,255,255,.03);border:0.5px solid var(--border2);border-radius:20px;padding:4px 13px;margin:4px 0;animation:msgIn .22s ease both}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.empty-icon{font-size:32px;opacity:.35}
.empty-state p{font-size:13px}

/* typing */
#typingBar{min-height:22px;padding:0 16px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-shrink:0}
.typing-dots{display:flex;gap:3px;align-items:center}
.typing-dots i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:dotBounce 1.2s infinite;display:inline-block}
.typing-dots i:nth-child(2){animation-delay:.2s}
.typing-dots i:nth-child(3){animation-delay:.4s}

/* footer */
.chat-footer{padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom));border-top:0.5px solid var(--border2);background:var(--surface2);display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative}
.emoji-toggle-btn{width:38px;height:38px;border-radius:9px;border:0.5px solid var(--border);background:transparent;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}
.emoji-toggle-btn:active{background:rgba(255,255,255,.06)}
#emojiPanel{position:absolute;bottom:calc(100% + 6px);left:12px;background:rgba(12,12,22,.98);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:10px;display:none;flex-wrap:wrap;gap:3px;width:min(280px,calc(100vw - 24px));max-height:200px;overflow-y:auto;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
#emojiPanel.show{display:flex;animation:pickerIn .15s ease both}
.ep-btn{width:34px;height:34px;border-radius:7px;border:none;background:transparent;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-tap-highlight-color:transparent}
.ep-btn:active{background:rgba(255,255,255,.08)}
#messageInput{flex:1;padding:10px 14px;background:var(--input-bg);border:0.5px solid var(--border);border-radius:var(--r-md);outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
#messageInput:focus{border-color:rgba(92,78,240,.45);box-shadow:0 0 0 3px rgba(92,78,240,.10)}
#messageInput::placeholder{color:var(--muted)}
#sendBtn{width:40px;height:40px;border-radius:11px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(92,78,240,.38);transition:transform .15s,box-shadow .15s;flex-shrink:0;color:#fff;-webkit-tap-highlight-color:transparent}
#sendBtn:active{transform:scale(.93)}
#sendBtn:disabled{opacity:.35;cursor:not-allowed}
#hostBtn{padding:6px 12px;background:rgba(92,78,240,.10);border:0.5px solid rgba(92,78,240,.28);border-radius:var(--r-sm);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;color:var(--accent3);white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
#hostPanel{backdrop-filter:blur(20px)}
#hostPanel button:hover{background:rgba(92,78,240,.22)!important}

/* ══ DESKTOP ══ */
@media(min-width:640px){
  #chatScreen{position:relative!important;inset:auto;width:760px;height:640px;border:0.5px solid rgba(255,255,255,.10);border-radius:var(--r-xl);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 0.5px rgba(255,255,255,.05) inset;flex-direction:row;backdrop-filter:blur(24px);background:var(--surface);overflow:hidden}
  #membersDrawer{position:relative!important;transform:none!important;width:196px;border-left:none;border-right:0.5px solid var(--border2);order:-1;backdrop-filter:none;background:rgba(6,6,15,.5)}
  #drawerBackdrop{display:none!important}
  .members-toggle{display:none}
  .drawer-close{display:none}
  .drawer-header{padding-top:18px}
  .chat-header{padding:15px 20px}
  #chat{padding:18px 20px 8px}
  .chat-footer{padding:10px 16px 14px}
  .msg-row{max-width:75%}
  .btn-primary:hover{background:#6d5ff5;box-shadow:0 10px 28px rgba(92,78,240,.45)}
  .btn-outline:hover{border-color:rgba(92,78,240,.4);color:var(--text)}
  .room-pill:hover{background:rgba(92,78,240,.20)}
  .emoji-toggle-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
  #sendBtn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(92,78,240,.45)}
  .ep-btn:hover{background:rgba(255,255,255,.07)}
  .member-item:hover{background:rgba(255,255,255,.03)}
  .btn-leave:hover{background:rgba(225,112,85,.14)}
  .code-box:hover{background:rgba(92,78,240,.11)}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- JOIN SCREEN -->
<div id="joinScreen">
  <div class="join-logo">
    <div class="logo-icon">⚡</div>
    <h1>Pulse Chat</h1>
  </div>
  <p class="join-label">Your Name</p>
  <input id="nameInput" class="join-input" type="text" placeholder="How should we call you?" autocomplete="off">
  <button id="createRoomBtn" class="btn-primary mb-16">✦ Create New Room</button>
  <div id="createdRoomBox" style="display:none">
    <div class="code-box" id="codeBox">
      <div class="code-value" id="generatedCode"></div>
      <div class="code-hint">Tap to copy · Share with friends</div>
    </div>
    <button id="enterCreatedBtn" class="btn-primary mb-16">Enter Room →</button>
  </div>
  <div class="divider">or join existing</div>
  <p class="join-label">Room Code</p>
  <input id="roomInput" class="join-input room-code-input" type="text" maxlength="8" placeholder="Enter room code" autocomplete="off">
  <button id="joinRoomBtn" class="btn-outline">Join Room</button>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen">
  <div id="membersDrawer">
    <div class="drawer-header">
      <div class="drawer-brand">
        <div class="drawer-icon">⚡</div>
        <span class="drawer-brand-name">Pulse</span>
      </div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="room-chip-wrap">
      <div class="room-chip" id="sidebarRoomPill">
        <div class="rc-dot"></div>
        <span id="sidebarRoomCode">——</span>
      </div>
    </div>
    <div class="members-section-label">Online <span class="member-count-badge" id="memberCount">0</span></div>
    <div id="membersList"></div>
  </div>
  <div id="drawerBackdrop"></div>
  <div class="chat-main">
    <div class="chat-header">
      <div class="header-info">
        <div class="header-title" id="headerRoomTitle">Room ——</div>
        <div class="header-meta"><span class="online-dot"></span><span id="headerMeta">Connected</span></div>
      </div>
      <span class="room-pill" id="roomPill"></span>
      <button class="members-toggle" id="membersToggle">👥<span class="members-badge" id="membersBadge">0</span></button>
      <button class="btn-leave" id="leaveBtn">Leave</button>
    </div>
    <div id="chat">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <p>Be the first to say something…</p>
      </div>
    </div>
    <div id="typingBar"></div>
    <div class="chat-footer">
      <div id="emojiPanel"></div>
      <button class="emoji-toggle-btn" id="emojiToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </button>
      <input id="messageInput" type="text" placeholder="Message…">
      <button id="sendBtn" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ══ BG3D ══ */
(function(){
  'use strict';
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = '#06060f';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    initRain();
  }
  resize();
  window.addEventListener('resize', resize);

  const W=()=>canvas.width, H=()=>canvas.height;
  function rand(a,b){return a+Math.random()*(b-a)}
  function hexRgba(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgba(${r},${g},${b},${a})`}

  const PAL=['#5c4ef0','#8b6ff7','#b48eff','#4f46e5','#7c3aed','#00d4aa','#fd79a8'];

  /* MATRIX RAIN */
  const FS=14;
  const CH='アイウエオカキクケコサシスセソタチツテトナニヌネノ01ﾊﾐﾋｰｳｼﾅﾓｻﾆｦｱｸﾘﾗﾈｳPULSE*+=-<>|░▒▓';
  let drops=[];

  function initRain(){
    const cols=Math.floor(W()/FS);
    drops=[];
    for(let i=0;i<cols;i++){
      drops.push({
        y:rand(-H(),0)/FS,
        speed:rand(0.20,0.60),
        len:Math.floor(rand(10,30)),
        bright:rand(0.55,1.0),
        color:Math.random()>.90?'#00d4aa':Math.random()>.82?'#fd79a8':'#8b6ff7',
        active:Math.random()>.30,
        dormantT:rand(60,280),dormantC:0
      });
    }
  }

  function drawRain(){
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(6,6,15,0.20)';
    ctx.fillRect(0,0,W(),H());
    ctx.font=FS+'px monospace';
    for(let i=0;i<drops.length;i++){
      const d=drops[i];
      if(!d.active){
        if(++d.dormantC>=d.dormantT){d.active=true;d.dormantC=0;d.y=-d.len-rand(0,20)}
        continue;
      }
      const hy=Math.floor(d.y);
      for(let t=0;t<d.len;t++){
        const cy=hy-t; if(cy<0)continue;
        const fade=1-t/d.len;
        const ch=CH[Math.floor(Math.random()*CH.length)];
        if(t===0){ctx.globalAlpha=d.bright;ctx.fillStyle='#fff';ctx.shadowBlur=12;ctx.shadowColor=d.color}
        else{ctx.globalAlpha=fade*0.90*d.bright;ctx.fillStyle=d.color;ctx.shadowBlur=t<4?7:0;ctx.shadowColor=d.color}
        ctx.fillText(ch,i*FS,cy*FS);
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
      d.y+=d.speed;
      if(d.y*FS>H()+d.len*FS){
        d.y=-d.len-rand(0,30);d.speed=rand(0.20,0.60);d.len=Math.floor(rand(10,30));
        d.bright=rand(0.55,1.0);
        d.color=Math.random()>.90?'#00d4aa':Math.random()>.82?'#fd79a8':'#8b6ff7';
        d.active=Math.random()>.20;d.dormantT=rand(60,280);d.dormantC=0;
      }
    }
  }

  /* MAGNETIC FIELD LINES */
  const poles=[];
  for(let i=0;i<6;i++){
    poles.push({
      x:rand(0.1,0.9),y:rand(0.1,0.9),
      vx:rand(-0.0003,0.0003),vy:rand(-0.0002,0.0002),
      charge:i%2===0?1:-1
    });
  }

  const flines=[];
  for(let i=0;i<poles.length;i++){
    for(let j=i+1;j<poles.length;j++){
      if(poles[i].charge!==poles[j].charge){
        const n=Math.floor(rand(2,5));
        for(let k=0;k<n;k++){
          flines.push({p1:poles[i],p2:poles[j],t:k/n,phase:rand(0,Math.PI*2),speed:rand(0.003,0.009),color:PAL[Math.floor(Math.random()*5)]});
        }
      }
    }
  }

  function updatePoles(){poles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<.05||p.x>.95)p.vx*=-1;if(p.y<.05||p.y>.95)p.vy*=-1})}

  function drawFieldLines(){
    const w=W(),h=H();
    flines.forEach(fl=>{
      const x1=fl.p1.x*w,y1=fl.p1.y*h,x2=fl.p2.x*w,y2=fl.p2.y*h;
      const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
      if(len<20)return;
      fl.phase+=fl.speed;
      const bulge=Math.sin(fl.phase)*len*(0.28+fl.t*0.45);
      const px=-dy/len,py=dx/len;
      const cx=(x1+x2)/2+px*bulge,cy=(y1+y2)/2+py*bulge;
      const dist01=len/Math.min(w,h);
      const alpha=Math.max(0,0.60-dist01*0.55);
      if(alpha<=0)return;
      ctx.globalAlpha=alpha;ctx.strokeStyle=fl.color;ctx.lineWidth=1.0;ctx.shadowBlur=10;ctx.shadowColor=fl.color;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
      const prog=(Date.now()*0.00045*(1+fl.t)+fl.t)%1;
      const tx=(1-prog)*(1-prog)*x1+2*(1-prog)*prog*cx+prog*prog*x2;
      const ty=(1-prog)*(1-prog)*y1+2*(1-prog)*prog*cy+prog*prog*y2;
      ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.shadowBlur=12;ctx.shadowColor=fl.color;
      ctx.beginPath();ctx.arc(tx,ty,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    });
  }

  /* RIPPLES */
  const ripples=[];
  function Ripple(x,y){return{x,y,r:0,maxR:rand(100,240),speed:rand(2.8,5.0),alpha:.80,color:PAL[Math.floor(Math.random()*5)],rings:Math.floor(rand(2,4)),dead:false}}
  function updateRipples(){for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=r.speed;r.alpha=.80*(1-r.r/r.maxR);if(r.r>=r.maxR)ripples.splice(i,1)}}
  function drawRipples(){
    ripples.forEach(r=>{
      for(let k=0;k<r.rings;k++){
        const rr=r.r-k*20;if(rr<=0)continue;
        ctx.globalAlpha=r.alpha*(1-k*.30);ctx.strokeStyle=r.color;ctx.lineWidth=1.6-k*.4;ctx.shadowBlur=16;ctx.shadowColor=r.color;
        ctx.beginPath();ctx.arc(r.x,r.y,rr,0,Math.PI*2);ctx.stroke();
      }
      ctx.shadowBlur=0;
      if(r.r<35){
        const g=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,35);
        g.addColorStop(0,hexRgba(r.color,.30));g.addColorStop(1,hexRgba(r.color,0));
        ctx.globalAlpha=(1-r.r/35)*.45;ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(r.x,r.y,35,0,Math.PI*2);ctx.fill();
      }
    });
  }
  function spawnRipple(x,y){if(ripples.length<14)ripples.push(Ripple(x,y))}
  document.addEventListener('click',e=>spawnRipple(e.clientX,e.clientY));
  document.addEventListener('touchstart',e=>{if(e.touches.length>0)spawnRipple(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});

  /* FLOATING SHAPES */
  function makeShape(init){
    const z=rand(0.10,0.38),s=rand(14,58)*z;
    return{
      x:rand(0,W()),y:init?rand(0,H()):H()+rand(20,80),
      z,size:s,speedY:rand(0.05,0.25)*z,speedX:rand(-0.06,0.06),
      rot:rand(0,Math.PI*2),rotSpeed:rand(-0.003,0.003),
      type:Math.floor(Math.random()*3),
      color:PAL[Math.floor(Math.random()*PAL.length)],
      alpha:rand(0.035,0.10)*z
    };
  }
  let shapes=Array.from({length:12},()=>makeShape(true));
  function updateShapes(){shapes.forEach((s,i)=>{s.x+=s.speedX;s.y+=s.speedY;s.rot+=s.rotSpeed;if(s.y<-(s.size*2)||s.y>H()+s.size*2)shapes[i]=makeShape(false)})}
  function drawShapes(){
    shapes.forEach(s=>{
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
      ctx.globalAlpha=s.alpha;ctx.strokeStyle=s.color;ctx.lineWidth=0.7;
      const sz=s.size;ctx.beginPath();
      if(s.type===0){for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;i===0?ctx.moveTo(Math.cos(a)*sz,Math.sin(a)*sz):ctx.lineTo(Math.cos(a)*sz,Math.sin(a)*sz)}ctx.closePath()}
      else if(s.type===1){ctx.rect(-sz/2,-sz/2,sz,sz)}
      else{ctx.moveTo(0,-sz);ctx.lineTo(sz*.866,sz*.5);ctx.lineTo(-sz*.866,sz*.5);ctx.closePath()}
      ctx.stroke();ctx.restore();
    });
  }

  /* PARTICLES */
  function makeParticle(init){
    const z=rand(0.2,1.0);
    return{x:rand(0,W()),y:init?rand(0,H()):H()+rand(5,20),z,r:rand(0.5,2.0)*z,
      speedY:rand(-0.18,-0.65)*z,speedX:rand(-0.09,0.09),
      color:PAL[Math.floor(Math.random()*PAL.length)],alpha:rand(0.18,0.60)*z,
      tw:rand(0,Math.PI*2),twSpd:rand(0.01,0.04)};
  }
  let particles=Array.from({length:75},()=>makeParticle(true));
  function updateParticles(){particles.forEach((p,i)=>{p.x+=p.speedX;p.y+=p.speedY;p.tw+=p.twSpd;if(p.y<-6)particles[i]=makeParticle(false)})}
  function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=p.alpha*(0.55+0.45*Math.sin(p.tw));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()})}

  /* LOOP */
  function frame(){
    drawRain();
    updatePoles();drawFieldLines();
    updateShapes();drawShapes();
    updateRipples();drawRipples();
    updateParticles();drawParticles();
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══ CHAT.JS ══ */
'use strict';
function fixViewportHeight(){const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;const cs=document.getElementById('chatScreen');if(cs&&cs.style.display!=='none')cs.style.height=vh+'px'}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fixViewportHeight);window.visualViewport.addEventListener('scroll',fixViewportHeight)}else window.addEventListener('resize',fixViewportHeight);

var stompClient=null,currentRoom=null,currentUser=null,currentHostToken=null,typingTimer=null,amTyping=false,typingUsers=new Set();

let _audioCtx;
function getAudioCtx(){if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();return _audioCtx}
function playTone(freq,type,dur,vol,delay){delay=delay||0;try{const c=getAudioCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.value=freq;const t=c.currentTime+delay;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur)}catch(e){}}
function soundJoin(){playTone(880,'sine',.25,.18);playTone(1100,'sine',.20,.12,.12)}
function soundLeave(){playTone(660,'sine',.25,.14);playTone(440,'sine',.25,.09,.12)}
function soundMessage(){playTone(1200,'sine',.12,.09)}
document.addEventListener('click',function(){try{getAudioCtx().resume()}catch(e){}},{once:true});

function generateRoomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function getAvatarColor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return 'hsl('+(Math.abs(h)%360)+',62%,56%)'}
function formatTime(d){return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function shakeInput(id){const el=document.getElementById(id);el.classList.add('error');setTimeout(()=>el.classList.remove('error'),800)}

document.getElementById('createRoomBtn').onclick=function(){
  const code=generateRoomCode();
  document.getElementById('generatedCode').textContent=code;
  document.getElementById('createdRoomBox').style.display='block';
  document.getElementById('roomInput').value=code;
  fetch('/createRoom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:code})})
    .then(r=>r.json()).then(data=>localStorage.setItem('hostToken_'+code,data.hostToken));
  document.getElementById('codeBox').onclick=function(){
    navigator.clipboard.writeText(code).catch(()=>{});
    const v=document.getElementById('generatedCode'),h=document.querySelector('.code-hint');
    v.textContent='COPIED!';h.textContent='✓ Copied';
    setTimeout(()=>{v.textContent=code;h.textContent='Tap to copy · Share with friends'},1800);
  };
};
document.getElementById('enterCreatedBtn').onclick=enterChat;
document.getElementById('joinRoomBtn').onclick=enterChat;

function enterChat(){
  const name=document.getElementById('nameInput').value.trim();
  const room=document.getElementById('roomInput').value.trim().toUpperCase();
  if(!name){shakeInput('nameInput');return}
  if(!room){shakeInput('roomInput');return}
  fetch('/canJoin/'+room).then(r=>r.json()).then(data=>{
    if(!data.allowed){alert('Room is locked 🔒');return}
    currentUser=name;currentRoom=room;currentHostToken=null;
    document.getElementById('joinScreen').style.display='none';
    document.getElementById('chatScreen').style.display='flex';
    fixViewportHeight();
    document.getElementById('roomPill').textContent=room;
    document.getElementById('headerRoomTitle').textContent='Room '+room;
    document.getElementById('headerMeta').textContent='You: '+name;
    document.getElementById('sidebarRoomCode').textContent=room;
    document.getElementById('roomPill').onclick=function(){navigator.clipboard.writeText(room).catch(()=>{});const p=document.getElementById('roomPill');p.textContent='COPIED!';setTimeout(()=>p.textContent=room,1500)};
    connectToRoom(room,name);
    const st=localStorage.getItem('hostToken_'+room);
    if(st){fetch('/verifyHost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:room,hostToken:st})}).then(r=>r.json()).then(res=>{if(res.valid){currentHostToken=st;showHostControls()}else{localStorage.removeItem('hostToken_'+room);currentHostToken=null}})}
  });
}

function showHostControls(){
  if(document.getElementById('hostBtn'))return;
  const b=document.createElement('button');b.id='hostBtn';b.textContent='⚙️ Host';b.onclick=toggleHostPanel;
  document.getElementById('leaveBtn').parentNode.insertBefore(b,document.getElementById('leaveBtn'));
}
function toggleHostPanel(){
  const p=document.getElementById('hostPanel');if(p){p.remove();return}
  const panel=document.createElement('div');panel.id='hostPanel';
  panel.style.cssText='position:absolute;top:60px;right:16px;background:rgba(8,8,18,.97);border:0.5px solid rgba(92,78,240,.3);border-radius:14px;padding:12px;z-index:100;display:flex;flex-direction:column;gap:8px;min-width:160px;box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(20px)';
  const lb=document.createElement('button');lb.id='lockBtn';lb.textContent='🔒 Lock Room';
  lb.style.cssText='background:rgba(92,78,240,.12);border:0.5px solid rgba(92,78,240,.28);color:#b48eff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Inter,sans-serif';
  lb.onclick=toggleLock;panel.appendChild(lb);document.getElementById('chatScreen').appendChild(panel);
}
function toggleLock(){fetch('/lockRoom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:currentRoom,hostToken:currentHostToken})}).then(r=>r.json()).then(d=>{const b=document.getElementById('lockBtn');if(b)b.textContent=d.locked?'🔓 Unlock Room':'🔒 Lock Room'})}
function kickUser(u){if(!confirm('Kick '+u+'?'))return;fetch('/kickUser',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomCode:currentRoom,hostToken:currentHostToken,targetUser:u})})}

function openDrawer(){document.getElementById('membersDrawer').classList.add('open');document.getElementById('drawerBackdrop').classList.add('show')}
function closeDrawer(){document.getElementById('membersDrawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('show')}
document.getElementById('membersToggle').onclick=openDrawer;
document.getElementById('drawerClose').onclick=closeDrawer;
document.getElementById('drawerBackdrop').onclick=closeDrawer;

function connectToRoom(room,name){
  const socket=new SockJS('/chat');stompClient=Stomp.over(socket);stompClient.debug=null;
  stompClient.connect({},function(){
    document.getElementById('sendBtn').disabled=false;
    stompClient.subscribe('/topic/messages/'+room,f=>handleIncomingMessage(JSON.parse(f.body)));
    stompClient.subscribe('/topic/typing/'+room,f=>handleTypingEvent(JSON.parse(f.body)));
    stompClient.subscribe('/topic/members/'+room,f=>updateMemberList(JSON.parse(f.body).message));
    stompClient.subscribe('/topic/roomStatus/'+room,f=>{const d=JSON.parse(f.body);showSystemMessage(d.locked?'Room locked 🔒':'Room unlocked 🔓')});
    stompClient.subscribe('/topic/kick/'+room,f=>{const d=JSON.parse(f.body);if(d.kickedUser===currentUser){alert('Kicked! 👢');document.getElementById('leaveBtn').click()}else showSystemMessage(d.kickedUser+' was kicked 👢')});
    fetch('/history/'+room).then(r=>r.json()).then(msgs=>{const e=document.getElementById('emptyState');if(e)e.remove();msgs.forEach(renderMessage)});
    stompClient.send('/app/join/'+room,{},JSON.stringify({sender:name,message:name+' joined ✦',room,type:'JOIN'}));
  });
}
function handleIncomingMessage(d){
  if(d.type==='JOIN'){showSystemMessage(d.sender+' joined ✦');if(d.sender!==currentUser)soundJoin()}
  else if(d.type==='LEAVE'){showSystemMessage(d.sender+' left');if(d.sender!==currentUser)soundLeave()}
  else{renderMessage(d);if(d.sender!==currentUser)soundMessage()}
}

document.getElementById('leaveBtn').onclick=function(){
  if(stompClient){stompClient.send('/app/leave/'+currentRoom,{},JSON.stringify({sender:currentUser,message:currentUser+' left',room:currentRoom,type:'LEAVE'}));setTimeout(()=>stompClient.disconnect(),200)}
  const hp=document.getElementById('hostPanel'),hb=document.getElementById('hostBtn');if(hp)hp.remove();if(hb)hb.remove();
  currentHostToken=null;
  document.getElementById('chatScreen').style.display='none';
  document.getElementById('chat').innerHTML='<div class="empty-state" id="emptyState"><div class="empty-icon">💬</div><p>Be the first to say something…</p></div>';
  document.getElementById('membersList').innerHTML='';document.getElementById('memberCount').textContent='0';
  document.getElementById('membersBadge').textContent='0';document.getElementById('typingBar').innerHTML='';
  document.getElementById('sendBtn').disabled=true;typingUsers.clear();amTyping=false;closeDrawer();
  document.getElementById('joinScreen').style.display='block';
};

function sendMessage(){const c=document.getElementById('messageInput').value.trim();if(!c||!stompClient)return;stompClient.send('/app/sendMessage/'+currentRoom,{},JSON.stringify({sender:currentUser,message:c,room:currentRoom,type:'CHAT'}));document.getElementById('messageInput').value='';stopTyping()}
document.getElementById('sendBtn').onclick=sendMessage;
document.getElementById('messageInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});
document.getElementById('messageInput').addEventListener('input',function(){if(!stompClient)return;if(!amTyping){amTyping=true;stompClient.send('/app/typing/'+currentRoom,{},JSON.stringify({sender:currentUser,message:'typing',room:currentRoom,type:'TYPING'}))}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,2000)});
function stopTyping(){if(!amTyping||!stompClient)return;amTyping=false;stompClient.send('/app/typing/'+currentRoom,{},JSON.stringify({sender:currentUser,message:'stop',room:currentRoom,type:'STOP_TYPING'}))}
function handleTypingEvent(d){if(d.sender===currentUser)return;if(d.type==='TYPING'||d.message==='typing')typingUsers.add(d.sender);else typingUsers.delete(d.sender);renderTypingBar()}
function renderTypingBar(){const bar=document.getElementById('typingBar');if(typingUsers.size===0){bar.innerHTML='';return}const n=[...typingUsers];const label=n.length===1?n[0]+' is typing':n.length===2?n[0]+' and '+n[1]+' are typing':n[0]+' and '+(n.length-1)+' others are typing';bar.innerHTML='<div class="typing-dots"><i></i><i></i><i></i></div><span>'+label+'</span>'}

function updateMemberList(csv){
  const names=(csv||'').split(',').filter(Boolean);
  const list=document.getElementById('membersList');list.innerHTML='';
  document.getElementById('memberCount').textContent=names.length;document.getElementById('membersBadge').textContent=names.length;
  names.forEach((name,idx)=>{
    const item=document.createElement('div');item.className='member-item';item.style.animationDelay=(idx*0.04)+'s';
    const av=document.createElement('div');av.className='member-avatar-sm';av.style.background=getAvatarColor(name);av.textContent=name.charAt(0).toUpperCase();
    const nm=document.createElement('div');nm.className='member-name'+(name===currentUser?' is-you':'');nm.textContent=name===currentUser?name+' (you)':name;
    item.append(av,nm);
    if(currentHostToken&&name!==currentUser){const kb=document.createElement('button');kb.textContent='👢';kb.title='Kick '+name;kb.style.cssText='margin-left:auto;background:transparent;border:none;cursor:pointer;font-size:14px;opacity:.6';kb.onclick=()=>kickUser(name);item.appendChild(kb)}
    else{const dot=document.createElement('div');dot.className='member-online';item.appendChild(dot)}
    list.appendChild(item);
  });
}

var EMOJI_LIST=[];var emojiPanel=document.getElementById('emojiPanel');
fetch('/emojis').then(r=>r.json()).then(d=>{EMOJI_LIST=d.map(e=>e.character);buildEmojiPanel()}).catch(()=>{EMOJI_LIST=['😀','😂','🥰','😎','🤔','😅','🔥','✨','👍','❤️','🎉','💯','😭','🤣','👀','💀','🙏','😤','🥳','💪','🫡','🫶','🤝','💥','🌟','⚡','🎯','💫','🤯','👏','😍','🤩','🥹','😇','🤗','😏','😒','🙄','😬','🤫'];buildEmojiPanel()});
function buildEmojiPanel(){emojiPanel.innerHTML='';EMOJI_LIST.forEach(e=>{const b=document.createElement('button');b.className='ep-btn';b.textContent=e;b.onclick=()=>{document.getElementById('messageInput').value+=e;document.getElementById('messageInput').focus();emojiPanel.classList.remove('show')};emojiPanel.appendChild(b)})}
document.getElementById('emojiToggle').onclick=function(e){e.stopPropagation();emojiPanel.classList.toggle('show')};
document.addEventListener('click',()=>emojiPanel.classList.remove('show'));
emojiPanel.addEventListener('click',e=>e.stopPropagation());

function showSystemMessage(text){const chat=document.getElementById('chat');const e=document.getElementById('emptyState');if(e)e.remove();const el=document.createElement('div');el.className='system-msg';el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
function renderMessage(msg){
  const chat=document.getElementById('chat');const e=document.getElementById('emptyState');if(e)e.remove();
  const isSelf=msg.sender===currentUser;
  const row=document.createElement('div');row.className='msg-row '+(isSelf?'self':'other');
  const av=document.createElement('div');av.className='msg-avatar';av.style.background=getAvatarColor(msg.sender);av.textContent=msg.sender.charAt(0).toUpperCase();
  const content=document.createElement('div');content.className='msg-content';
  if(!isSelf){const nm=document.createElement('div');nm.className='msg-name';nm.textContent=msg.sender;content.appendChild(nm)}
  const bub=document.createElement('div');bub.className='msg-bubble';bub.textContent=msg.message;content.appendChild(bub);
  const tm=document.createElement('div');tm.className='msg-time';tm.textContent=formatTime(msg.timestamp?new Date(msg.timestamp):new Date());content.appendChild(tm);
  row.append(av,content);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
}
</script>
